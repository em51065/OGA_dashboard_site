<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>一般回收</title>
<style>
  :root {
    --ink: #101827;
    --muted: #607086;
    --line: #d9e1ec;
    --paper: #f5f7fb;
    --blue: #2563eb;
    --red: #d43f55;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: transparent;
    color: var(--ink);
    font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
  }
  .ga-widget {
    width: min(1180px, 100%);
    margin: 0 auto;
    padding: 18px;
    background:
      radial-gradient(circle at 12% 0%, rgba(37, 99, 235, 0.10), transparent 28%),
      radial-gradient(circle at 92% 12%, rgba(212, 63, 85, 0.12), transparent 30%),
      var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
  }
  .ga-head {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 16px;
    align-items: end;
    margin-bottom: 14px;
  }
  h1 {
    margin: 0 0 6px;
    font-size: clamp(24px, 3vw, 36px);
    line-height: 1.1;
    letter-spacing: 0;
  }
  .ga-sub {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
  }
  .ga-control {
    min-width: 180px;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: rgba(255,255,255,0.86);
  }
  .ga-controls {
    display: flex;
    gap: 10px;
    align-items: stretch;
    justify-content: flex-end;
  }
  .ga-control[hidden] {
    display: none;
  }
  .ga-control label {
    display: block;
    margin-bottom: 6px;
    color: #334155;
    font-size: 12px;
    font-weight: 900;
  }
  select {
    width: 100%;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    padding: 9px 10px;
    background: #fff;
    color: var(--ink);
    font-size: 15px;
    font-weight: 900;
  }
  .ga-grid {
    display: grid;
    grid-template-columns: minmax(300px, 0.92fr) minmax(0, 1.45fr);
    gap: 14px;
  }
  .ga-card {
    border: 1px solid var(--line);
    border-radius: 12px;
    background: rgba(255,255,255,0.94);
    box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
  }
  .ga-pr-card { padding: 18px; }
  .ga-card-title {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }
  .ga-card-title h2 {
    margin: 0;
    font-size: 18px;
    line-height: 1.2;
  }
  .ga-coverage-wrap {
    position: relative;
    flex: 0 0 auto;
  }
  .ga-coverage {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 6px 10px;
    border: 1px solid #dbeafe;
    border-radius: 999px;
    background: #eef6ff;
    color: #1d4ed8;
    font-family: inherit;
    font-size: 12px;
    font-weight: 950;
    white-space: nowrap;
    cursor: pointer;
  }
  .ga-coverage[hidden] {
    display: none !important;
  }
  .ga-coverage:hover,
  .ga-coverage[aria-expanded="true"] {
   border-color: #93c5fd;
   background: #dbeafe;
  }
  .ga-coverage.ga-formula {
    align-items: flex-start;
    justify-content: flex-start;
    flex-direction: column;
    gap: 5px;
    max-width: 330px;
    padding: 8px 10px;
    border-color: #d9e1ec;
    border-radius: 12px;
    background: #f8fafc;
    color: #334155;
    line-height: 1.35;
    text-align: left;
    white-space: normal;
    cursor: default;
  }
  .ga-coverage.ga-formula:hover,
  .ga-coverage.ga-formula[aria-expanded="true"] {
    border-color: #d9e1ec;
    background: #f8fafc;
  }
  .ga-formula-title {
    align-self: flex-end;
    color: #64748b;
    font-size: 11px;
    font-weight: 950;
  }
  .ga-formula-line {
    display: block;
    color: #101827;
    font-size: 12px;
    font-weight: 950;
  }
  .ga-formula-math {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #101827;
    font-size: 12.5px;
    font-weight: 500;
    line-height: 1.15;
    white-space: nowrap;
  }
  .ga-fraction {
    display: inline-grid;
    grid-template-rows: auto auto;
    align-items: center;
    min-width: 102px;
    text-align: center;
  }
  .ga-frac-top {
    display: block;
    padding: 0 8px 4px;
    border-bottom: 2px solid #111827;
  }
  .ga-frac-bottom {
    display: block;
    padding: 4px 8px 0;
  }
  .ga-formula-times {
    font-size: 13.5px;
    font-weight: 500;
  }
  .ga-month-popover {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    z-index: 30;
    width: 252px;
    padding: 12px;
    border: 1px solid #dbe4ef;
    border-radius: 12px;
    background: #ffffff;
    box-shadow: 0 18px 38px rgba(15, 23, 42, 0.16);
  }
  .ga-month-popover[hidden] {
    display: none;
  }
  .ga-month-title {
    margin-bottom: 9px;
    color: #101827;
    font-size: 13px;
    font-weight: 950;
  }
  .ga-month-fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .ga-month-fields label {
    color: #475569;
    font-size: 11px;
    font-weight: 900;
  }
  .ga-month-fields select {
    margin-top: 4px;
    padding: 7px 8px;
    font-size: 13px;
  }
  .ga-month-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 10px;
  }
  .ga-month-actions button {
    border: 0;
    border-radius: 999px;
    padding: 7px 11px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 950;
    cursor: pointer;
  }
  .ga-month-reset {
    background: #edf2f7;
    color: #475569;
  }
  .ga-month-apply {
    background: #101827;
    color: #ffffff;
  }
  .ga-pr-score {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 10px;
    margin: 4px 0 12px;
    transform: translateX(-8%);
  }
  .ga-pr-score strong {
    font-size: clamp(54px, 8vw, 86px);
    line-height: 0.9;
    font-weight: 950;
  }
  .ga-pr-score span {
    margin-bottom: 8px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 900;
  }
  .ga-replacement-chart .ga-pr-card {
    overflow: hidden;
  }
  .ga-replacement-chart .ga-card-title {
    align-items: flex-start;
  }
  .ga-replacement-chart .ga-card-title h2 {
    min-width: 0;
  }
  .ga-replacement-chart .ga-coverage-wrap {
    max-width: 52%;
  }
  .ga-replacement-chart .ga-coverage.ga-formula {
    max-width: 100%;
    padding: 7px 9px;
  }
  .ga-replacement-chart .ga-pr-score {
    justify-content: flex-start;
    align-items: flex-end;
    gap: 8px;
    min-width: 0;
    margin: 10px 0 12px;
    transform: none;
  }
  .ga-replacement-chart .ga-pr-score strong {
    flex: 0 1 auto;
    min-width: 0;
    max-width: 76%;
    font-size: clamp(44px, 5vw, 66px);
    letter-spacing: -0.025em;
    line-height: 0.92;
    white-space: nowrap;
  }
  .ga-replacement-chart .ga-pr-score span {
    flex: 0 0 auto;
    min-width: 58px;
    margin-bottom: 4px;
    color: #64748b;
    font-size: clamp(9px, 0.82vw, 11px);
    line-height: 1.15;
    font-weight: 950;
    white-space: nowrap;
  }
  .ga-value-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 14px 0;
  }
  .ga-mini {
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 11px 12px;
    background: #f8fafc;
  }
  .ga-mini-label {
    color: var(--muted);
    font-size: 12px;
    font-weight: 900;
  }
  .ga-mini-value {
    margin-top: 4px;
    font-size: 22px;
    font-weight: 950;
    white-space: nowrap;
    overflow: hidden;
  }
  .ga-replacement-chart .ga-mini {
    padding: 10px 11px;
  }
  .ga-replacement-chart .ga-mini-label {
    font-size: 11.5px;
  }
  .ga-replacement-chart .ga-mini-value {
    font-size: clamp(19px, 2.15vw, 22px);
  }
  .ga-value-number,
  .ga-value-unit {
    display: inline-block;
    vertical-align: baseline;
  }
  .ga-value-unit {
    margin-left: 4px;
    font-size: 0.76em;
    line-height: 1;
  }
  .ga-pr-track {
    position: relative;
    height: 32px;
    margin: 18px 0 9px;
    border-radius: 999px;
    background: #e9eef6;
    overflow: hidden;
  }
  .ga-pr-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, #2563eb 0%, #b8c7d9 52%, #d43f55 100%) left center / 100% 100% no-repeat;
    transition: width 260ms ease;
  }
  .ga-pr-pin {
    position: absolute;
    top: -5px;
    left: 0%;
    width: 4px;
    height: 42px;
    border-radius: 999px;
    background: #111827;
    box-shadow: 0 0 0 4px rgba(255,255,255,0.78);
    transform: translateX(-2px);
    transition: left 260ms ease;
  }
  .ga-axis {
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: 11px;
    font-weight: 900;
  }
  .ga-hint {
    margin-top: 12px;
    color: #475569;
    font-size: 12px;
    line-height: 1.45;
  }
  .ga-replacement-chart .ga-hint {
    white-space: nowrap;
    font-size: clamp(8.6px, 0.72vw, 12px);
    line-height: 1.32;
    letter-spacing: -0.018em;
  }
  .ga-overview-wrap {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px dashed #cbd5e1;
  }
  .ga-overview-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
    min-height: 36px;
    margin-bottom: 2px;
  }
  .ga-overview-head h3 {
    margin: 0;
    color: #101827;
    font-size: 15px;
    line-height: 1.25;
    font-weight: 950;
  }
  .ga-overview-note {
    align-self: flex-end;
    margin-left: auto;
    padding-bottom: 1px;
    color: #64748b;
    font-size: 11px;
    font-weight: 850;
    line-height: 1.25;
    text-align: right;
    white-space: nowrap;
  }
  .ga-overview-note[hidden] {
    display: none;
  }
  .ga-mode-switch {
    display: inline-flex;
    gap: 4px;
    padding: 4px;
    border: 1px solid #dbe4ef;
    border-radius: 999px;
    background: #f8fafc;
    flex: 0 0 auto;
  }
  .ga-mode-switch[hidden] {
    display: none;
  }
  .ga-mode-switch button {
    border: 0;
    border-radius: 999px;
    padding: 6px 12px;
    background: transparent;
    color: #64748b;
    font-size: 12px;
    font-weight: 950;
    cursor: pointer;
  }
  .ga-mode-switch button.active {
    background: #101827;
    color: #ffffff;
  }
  #overviewChart { height: 260px; }
  .ga-chart-card { padding: 14px 16px 8px; position: relative; }
  .ga-quality-head {
    display: grid;
    grid-template-columns: minmax(0, 1fr) clamp(228px, 31%, 300px);
    gap: 12px;
    align-items: start;
    padding: 0 2px 2px;
  }
  .ga-quality-head[hidden] { display: none; }
  .ga-quality-copy { min-width: 0; }
  .ga-quality-kicker {
    margin-bottom: 4px;
    color: #7c8ca3;
    font-size: 10.5px;
    line-height: 1.1;
    font-weight: 950;
    letter-spacing: 0.18em;
  }
  .ga-quality-copy h2 {
    margin: 0 0 3px;
    color: #101827;
    font-size: clamp(17px, 1.35vw, 19px);
    line-height: 1.16;
    font-weight: 950;
  }
  .ga-quality-copy p {
    margin: 0;
    display: grid;
    grid-template-columns: max-content minmax(0, 1fr);
    column-gap: 0;
    align-items: start;
    color: #101827;
    font-size: clamp(11.8px, 0.94vw, 13.6px);
    line-height: 1.43;
    font-weight: 400;
  }
  .ga-quality-copy p + p { margin-top: 1px; }
  .ga-quality-copy strong { font-weight: 400; white-space: nowrap; }
  .ga-quality-formula {
    justify-self: end;
    width: 100%;
    max-width: 300px;
    display: grid;
    grid-template-columns: auto auto;
    gap: 10px 11px;
    align-items: center;
    padding: 7px 9px;
    border: 1px solid rgba(203,213,225,0.48);
    border-radius: 12px;
    background: rgba(248,250,252,0.54);
    box-shadow: none;
    color: #253047;
    font-size: clamp(9.9px, 0.82vw, 11.7px);
    font-weight: 400;
    line-height: 1.15;
  }
  .ga-quality-formula[hidden] { display: none; }
  .ga-formula-name { color: #253047; letter-spacing: 0; white-space: nowrap; font-weight: 400; justify-self: end; text-align: right; }
  .ga-formula-frac {
    display: inline-grid;
    grid-template-rows: auto auto;
    min-width: clamp(66px, 7.2vw, 76px);
    text-align: center;
    line-height: 1.08;
    vertical-align: middle;
  }
  .ga-formula-frac span:first-child {
    border-bottom: 1.4px solid #253047;
    padding: 0 4px 2px;
  }
  .ga-formula-frac span:last-child { padding: 2px 4px 0; }
  .ga-formula-times { margin-left: 3px; }
  .ga-quality-formula .ga-formula-times { font-size: clamp(9.4px, 0.76vw, 11px); }
  #trendChart { height: 586px; margin-top: 2px; }
  .ga-replacement-chart #trendChart { height: 500px; margin-top: 0; }
  @media (max-width: 860px) {
    .ga-quality-head { grid-template-columns: 1fr; }
    .ga-quality-formula { justify-self: start; width: min(100%, 300px); }
  }
  .ga-trend-hover-tip {
    position: absolute;
    z-index: 8;
    display: none;
    min-width: 178px;
    max-width: 250px;
    padding: 9px 11px;
    border: 1px solid #d9e1ec;
    border-radius: 8px;
    background: rgba(255,255,255,0.96);
    box-shadow: 0 14px 30px rgba(15,23,42,0.14);
    color: #101827;
    font-size: 12px;
    line-height: 1.42;
    pointer-events: none;
  }
  .ga-trend-hover-tip strong {
    display: block;
    margin-bottom: 4px;
    color: #101827;
    font-size: 13px;
    font-weight: 950;
  }
  .ga-trend-hover-tip span {
    display: block;
    color: #475569;
    font-weight: 800;
  }
  .ga-toggle-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 8px 10px 56px;
  }
  .ga-toggle-bar[hidden] {
    display: none;
  }
  .ga-icon-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid #dbe4ef;
    border-radius: 999px;
    padding: 6px 9px;
    background: #ffffff;
    color: #64748b;
    font-size: 12px;
    font-weight: 950;
    cursor: pointer;
    opacity: 0.42;
    transition: opacity 160ms ease, transform 160ms ease, border-color 160ms ease;
  }
  .ga-icon-toggle.active {
    border-color: currentColor;
    opacity: 1;
    transform: translateY(-1px);
  }
  .ga-icon-symbol {
    display: inline-grid;
    place-items: center;
    width: 22px;
    height: 22px;
    border-radius: 999px;
    background: rgba(15, 23, 42, 0.08);
    font-size: 12px;
  }
  .ga-error {
    padding: 18px;
    border: 1px solid #fecaca;
    border-radius: 10px;
    background: #fff1f2;
    color: #9f1239;
    font-weight: 900;
  }
  @media (max-width: 860px) {
    .ga-head,
    .ga-grid,
    .ga-value-row { grid-template-columns: 1fr; }
    .ga-controls { justify-content: stretch; flex-direction: column; }
    .ga-control { min-width: 0; }
    .ga-toggle-bar { padding-left: 8px; }
    #trendChart { height: 506px; }
  }
</style>
</head>
<body>
<div class="ga-widget" id="gaWidget">
  <div class="ga-head">
    <div>
      <h1>一般回收</h1>
      <div class="ga-sub">用年度排名呈現一般回收的歷史位置；完整年只比完整年，未滿年只比同期累積。</div>
    </div>
    <div class="ga-controls">
      <div class="ga-control" id="locationControl" hidden>
        <label for="locationSelect" id="locationLabel">選擇地點</label>
        <select id="locationSelect"></select>
      </div>
      <div class="ga-control" id="categoryControl" hidden>
        <label for="categorySelect" id="categoryLabel">選擇類別</label>
        <select id="categorySelect"></select>
      </div>
      <div class="ga-control">
        <label for="yearSelect">選擇年份</label>
        <select id="yearSelect"></select>
      </div>
    </div>
  </div>
  <div class="ga-grid">
    <section class="ga-card ga-pr-card">
      <div class="ga-card-title">
        <h2 id="rankTitle">歷史排名-回收量</h2>
        <div class="ga-coverage-wrap">
          <button type="button" class="ga-coverage" id="yearMonthsTop" aria-expanded="false">--</button>
          <div class="ga-month-popover" id="monthPopover" hidden>
            <div class="ga-month-title">選擇資料涵蓋範圍</div>
            <div class="ga-month-fields">
              <label>
                起月
                <select id="monthStartSelect"></select>
              </label>
              <label>
                迄月
                <select id="monthEndSelect"></select>
              </label>
            </div>
            <div class="ga-month-actions">
              <button type="button" class="ga-month-reset" id="monthResetBtn">預設</button>
              <button type="button" class="ga-month-apply" id="monthApplyBtn">套用</button>
            </div>
          </div>
        </div>
      </div>
      <div class="ga-pr-score">
        <strong id="rankNumber">--</strong>
        <span id="rankTotal">/ -- 年</span>
      </div>
      <div class="ga-value-row">
        <div class="ga-mini">
          <div class="ga-mini-label" id="valueMiniLabel">回收量</div>
          <div class="ga-mini-value" id="yearValue">--</div>
        </div>
        <div class="ga-mini">
          <div class="ga-mini-label" id="secondaryMiniLabel">相對均值</div>
          <div class="ga-mini-value" id="meanDiff">--</div>
        </div>
      </div>
      <div class="ga-pr-track">
        <div class="ga-pr-fill" id="rankFill"></div>
        <div class="ga-pr-pin" id="rankPin"></div>
      </div>
      <div class="ga-axis"><span>低</span><span>中</span><span>高</span></div>
      <div class="ga-hint" id="rankHint">長條圖顯示所選年度與所有比較年度的回收量。</div>
      <div class="ga-overview-wrap">
        <div class="ga-overview-head">
          <h3 id="overviewTitle">年度總覽</h3>
          <div class="ga-overview-note" id="overviewNote" hidden></div>
          <div class="ga-mode-switch" id="overviewModeSwitch" hidden>
            <button type="button" data-overview-mode="bar" class="active">長條</button>
            <button type="button" data-overview-mode="pie">圓餅</button>
          </div>
        </div>
        <div id="overviewChart"></div>
      </div>
    </section>
    <section class="ga-card ga-chart-card">
      <div class="ga-quality-head" id="qualityHead" hidden>
        <div class="ga-quality-copy">
          <h2>汰換效益總覽</h2>
          <p><strong>平均節省瓦數：</strong>該年每盞完成汰換的燈具，平均降低的瓦數。</p>
          <p><strong>改善率：</strong>該年汰換後，相對於原燈具總瓦數，整體用電瓦數降低的比例。</p>
        </div>
        <div class="ga-quality-formula" id="qualityFormula" hidden></div>
      </div>
      <div id="trendChart"></div>
      <div class="ga-trend-hover-tip" id="trendHoverTip"></div>
      <div class="ga-toggle-bar" id="trendToggles" hidden></div>
    </section>
  </div>
</div>

<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script>
let GA_DATA = null;
let selectedYear = null;
let selectedCategory = null;
let selectedLocation = null;
let visibleTrendCategories = new Set();
let overviewMode = "bar";
let customMonthRange = null;
let customReplacementYearRange = null;
let trendDialogState = null;
const fmt = new Intl.NumberFormat("zh-TW", { maximumFractionDigits: 2 });
const pctFmt = new Intl.NumberFormat("zh-TW", { maximumFractionDigits: 1 });
const yearSelect = document.getElementById("yearSelect");
const categorySelect = document.getElementById("categorySelect");
const categoryControl = document.getElementById("categoryControl");
const categoryLabel = document.getElementById("categoryLabel");
const locationSelect = document.getElementById("locationSelect");
const locationControl = document.getElementById("locationControl");
const locationLabel = document.getElementById("locationLabel");

const qualityHead = document.getElementById("qualityHead");

function isEcocoChart() {
  return GA_DATA.chartType === "ecoco";
}

function isSolarChart() {
  return GA_DATA.chartType === "solar";
}

function isUtilityChart() {
  return GA_DATA.chartType === "utility";
}

function isStreetlightChart() {
  return GA_DATA.chartType === "streetlight";
}

function isReplacementChart() {
  return GA_DATA.chartType === "streetlight" || GA_DATA.chartType === "led_replacement";
}

function usesMonthCoverage() {
  return !GA_DATA.disableMonthRange && !isStreetlightChart() && !isReplacementChart();
}

function usesYearRange() {
  return isReplacementChart();
}

function hasLocationOverviewMode() {
  return isSolarChart() || isStreetlightChart();
}

function locationModeTarget() {
  return isStreetlightChart() ? selectedLocation : selectedCategory;
}

function aggregateLocationKey() {
  return isStreetlightChart() ? GA_DATA.defaultLocation : GA_DATA.defaultCategory;
}

function locationAxisName() {
  return isStreetlightChart() ? "校區" : "地點";
}

function usesLocationRanking() {
  return overviewMode === "location" &&
    hasLocationOverviewMode() &&
    locationModeTarget() &&
    locationModeTarget() !== aggregateLocationKey();
}

function hasCategoryControl() {
  return Array.isArray(GA_DATA.categories) && GA_DATA.categories.length > 0;
}

function hasTrendToggles() {
  return overviewMode !== "location" && (isEcocoChart() || isSolarChart());
}

function activeMeta(category = selectedCategory) {
  return (GA_DATA.categoryMeta && GA_DATA.categoryMeta[category]) || {
    unit: GA_DATA.unit,
    valueNoun: GA_DATA.valueNoun,
    agg: "sum",
  };
}

function activeUnit(category = selectedCategory) {
  return activeMeta(category).unit || GA_DATA.unit;
}

function activeValueNoun(category = selectedCategory) {
  return activeMeta(category).valueNoun || GA_DATA.valueNoun;
}

function activeFormulaLines(category = selectedCategory) {
  return activeMeta(category).formulaLines || [];
}

function activeFormulaHtml(category = selectedCategory) {
  return activeMeta(category).formulaHtml || "";
}

function activeTrendSubtitle(category = selectedCategory, fallback = "") {
  return activeMeta(category).trendSubtitle || fallback;
}

function boldTitle(text) {
  return `<b>${text}</b>`;
}

function currentSeries(category = selectedCategory) {
  if (GA_DATA.locationSeries) {
    const location = selectedLocation || GA_DATA.defaultLocation;
    return (GA_DATA.locationSeries[location] && GA_DATA.locationSeries[location][category]) || { defaultYear: null, records: [], monthly: [] };
  }
  if (!hasCategoryControl()) return GA_DATA;
  return GA_DATA.series[category] || GA_DATA.series[GA_DATA.defaultCategory];
}

function recordForYear(year, category = selectedCategory) {
  const series = currentSeries(category);
  if (!series.records || !series.records.length) return null;
  return series.records.find((item) => String(item.year) === String(year)) || series.records[series.records.length - 1];
}

function mixColor(a, b, t) {
  const rgb = a.map((value, idx) => Math.round(value + (b[idx] - value) * t));
  return `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`;
}

function colorForPosition(position) {
  const p = Math.max(0, Math.min(100, Number(position))) / 100;
  const mid = [184, 199, 217];
  if (p < 0.5) return mixColor([37, 99, 235], mid, p / 0.5);
  return mixColor(mid, [212, 63, 85], (p - 0.5) / 0.5);
}

function visibleBarValues(values) {
  const maxValue = Math.max(...values.map((value) => Math.abs(Number(value) || 0)), 1);
  const minVisible = maxValue * 0.018;
  return values.map((value) => {
    const numeric = Number(value) || 0;
    if (numeric === 0) return 0;
    return Math.max(numeric, minVisible);
  });
}

function formatMonths(months) {
  const list = [...new Set((months || []).map(Number).filter(Number.isFinite))].sort((a, b) => a - b);
  if (!list.length) return "無資料";
  if (list.length === 1) return `${list[0]}月`;
  const isConsecutive = list.every((month, idx) => idx === 0 || month === list[idx - 1] + 1);
  if (isConsecutive) return `${list[0]}-${list[list.length - 1]}月`;
  return `${list.join("、")}月`;
}

function monthsInRange(months, startMonth, endMonth) {
  return [...new Set((months || []).map(Number).filter((month) => month >= startMonth && month <= endMonth))]
    .sort((a, b) => a - b);
}

function valuesForYearUntil(year, cutoffMonth, category = selectedCategory) {
  const series = currentSeries(category);
  const rows = series.monthly
    .filter((item) => Number(item.year) === Number(year) && Number(item.month) <= Number(cutoffMonth))
    .sort((a, b) => a.month - b.month);
  return {
    value: aggregateRows(rows, category),
    months: rows.map((item) => Number(item.month)),
  };
}

function aggregateRows(rows, category = selectedCategory) {
  const meta = activeMeta(category);
  if (meta.agg === "ratio") {
    const numerator = rows.reduce((sum, item) => sum + Number(item.numerator || 0), 0);
    const denominator = rows.reduce((sum, item) => sum + Number(item.denominator || 0), 0);
    return denominator > 0 ? numerator / denominator : 0;
  }
  return rows.reduce((sum, item) => sum + Number(item.value || 0), 0);
}

function valuesForYearRange(year, startMonth, endMonth, category = selectedCategory) {
  const series = currentSeries(category);
  const rows = series.monthly
    .filter((item) =>
      Number(item.year) === Number(year) &&
      Number(item.month) >= Number(startMonth) &&
      Number(item.month) <= Number(endMonth)
    )
    .sort((a, b) => a.month - b.month);
  return {
    value: aggregateRows(rows, category),
    months: rows.map((item) => Number(item.month)),
  };
}

function hasLocationData(row) {
  return row && row.hasData !== false && Number.isFinite(Number(row.value));
}

function defaultRangeForRecord(record) {
  if (!record) return { start: 1, end: 12 };
  const months = [...new Set((record.monthsList || []).map(Number).filter(Number.isFinite))]
    .sort((a, b) => a - b);
  if (months.length) {
    return {
      start: months[0],
      end: months[months.length - 1],
    };
  }
  return {
    start: 1,
    end: record.hasDecember ? 12 : Number(record.maxMonth || 12),
  };
}

function activeMonthRangeForYear(year, category = selectedCategory) {
  const record = recordForYear(year, category);
  if (!usesMonthCoverage()) return { start: 1, end: 12, isCustom: false };
  if (customMonthRange) return { ...customMonthRange, isCustom: true };
  return { ...defaultRangeForRecord(record), isCustom: false };
}

function averageRank(value, values) {
  const less = values.filter((item) => item < value - 1e-9).length;
  const equal = values.filter((item) => Math.abs(item - value) <= 1e-9).length;
  return less + 1 + (equal - 1) / 2;
}

function comparisonForYear(year, category = selectedCategory) {
  const series = currentSeries(category);
  const selectedRecord = recordForYear(year, category);
  if (!selectedRecord) {
    return {
      selected: null,
      selectedRecord: null,
      selectedDisplayMonths: [],
      startMonth: 1,
      cutoffMonth: 12,
      shortBasisLabel: "無資料",
      rows: [],
      values: [],
      mean: 0,
      category,
    };
  }
  const range = activeMonthRangeForYear(year, category);
  const cutoffMonth = range.end;
  if (!usesMonthCoverage()) {
    let rows = series.records.map((record) => ({
      ...record,
      comparisonMonths: record.monthsList || [],
    })).filter((row) => row.comparisonMonths.length);
    const values = rows.map((row) => row.value);
    rows = rows.map((row) => {
      const rank = averageRank(row.value, values);
      const higher = values.filter((item) => item > row.value + 1e-9).length;
      const lower = values.filter((item) => item < row.value - 1e-9).length;
      return {
        ...row,
        rank,
        pr: rows.length === 1 ? 100 : 1 + (rank - 1) * 99 / (rows.length - 1),
        rankHigh: higher + 1,
        relativePosition: rows.length === 1 ? 100 : (lower / (rows.length - 1)) * 100,
      };
    });
    const selected = rows.find((row) => String(row.year) === String(year)) || rows[rows.length - 1];
    const mean = values.reduce((sum, value) => sum + value, 0) / values.length;
    return {
      selected,
      selectedRecord,
      selectedDisplayMonths: selectedRecord.monthsList || [],
      startMonth: 1,
      cutoffMonth: 12,
      shortBasisLabel: "年度資料",
      rows,
      values,
      mean,
      category,
    };
  }
  const selectedDisplayMonths = range.isCustom
    ? monthsInRange(selectedRecord.monthsList, range.start, range.end)
    : selectedRecord.monthsList;
  const isFullYearRange = !range.isCustom && range.start === 1 && range.end === 12;
  const shortBasisLabel = isFullYearRange ? "全年累積" : `${formatMonths(selectedDisplayMonths)}累積`;
  let rows = series.records.map((record) => {
    const part = valuesForYearRange(record.year, range.start, range.end, category);
    return { ...record, value: part.value, comparisonMonths: part.months };
  }).filter((row) => {
    if (!row.comparisonMonths.length) return false;
    if (range.start === range.end) return row.comparisonMonths.includes(range.start);
    return row.comparisonMonths.includes(range.start) && row.comparisonMonths.includes(range.end);
  });

  if (!rows.length) {
    return {
      selected: { ...selectedRecord, value: 0, rankHigh: 1, relativePosition: 100, comparisonMonths: [] },
      selectedRecord,
      selectedDisplayMonths,
      startMonth: range.start,
      cutoffMonth,
      shortBasisLabel,
      rows: [],
      values: [],
      mean: 0,
      category,
    };
  }

  const values = rows.map((row) => row.value);
  rows = rows.map((row) => {
    const rank = averageRank(row.value, values);
    const pr = rows.length === 1 ? 100 : 1 + (rank - 1) * 99 / (rows.length - 1);
    const higher = values.filter((item) => item > row.value + 1e-9).length;
    const lower = values.filter((item) => item < row.value - 1e-9).length;
    const rankHigh = higher + 1;
    const relativePosition = rows.length === 1 ? 100 : (lower / (rows.length - 1)) * 100;
    return { ...row, rank, pr, rankHigh, relativePosition };
  });

  const selected = rows.find((row) => String(row.year) === String(year)) || rows[rows.length - 1];
  const mean = values.reduce((sum, value) => sum + value, 0) / values.length;
  return { selected, selectedRecord, selectedDisplayMonths, startMonth: range.start, cutoffMonth, shortBasisLabel, rows, values, mean, category };
}

function locationRowsForSelectedYear() {
  const baseComparison = comparisonForYear(selectedYear, selectedCategory);
  if (isSolarChart()) {
    return (GA_DATA.rawCategories || []).map((location) => {
      const part = valuesForYearRange(selectedYear, baseComparison.startMonth, baseComparison.cutoffMonth, location);
      return {
        location,
        value: part.months.length ? part.value : null,
        comparisonMonths: part.months,
        hasData: part.months.length > 0,
      };
    });
  }
  if (isStreetlightChart() && GA_DATA.locationSeries) {
    return (GA_DATA.locations || [])
      .filter((location) => location !== GA_DATA.defaultLocation)
      .map((location) => {
        const series = GA_DATA.locationSeries[location] && GA_DATA.locationSeries[location][selectedCategory];
        const record = series && series.records
          ? series.records.find((item) => String(item.year) === String(selectedYear))
          : null;
        return record
          ? { location, value: Number(record.value || 0), comparisonMonths: record.monthsList || [], hasData: true }
          : { location, value: null, comparisonMonths: [], hasData: false };
      })
      .filter(Boolean);
  }
  return [];
}

function locationRankingComparison() {
  const baseComparison = comparisonForYear(selectedYear, selectedCategory);
  let rows = locationRowsForSelectedYear().filter(hasLocationData);
  if (!rows.length) return { ...baseComparison, selected: null, rows: [], values: [], mean: 0, rankingMode: "location" };
  const values = rows.map((row) => row.value);
  rows = rows.map((row) => {
    const rank = averageRank(row.value, values);
    const higher = values.filter((item) => item > row.value + 1e-9).length;
    const lower = values.filter((item) => item < row.value - 1e-9).length;
    return {
      ...row,
      year: selectedYear,
      rank,
      pr: rows.length === 1 ? 100 : 1 + (rank - 1) * 99 / (rows.length - 1),
      rankHigh: higher + 1,
      relativePosition: rows.length === 1 ? 100 : (lower / (rows.length - 1)) * 100,
    };
  });
  const selected = rows.find((row) => row.location === locationModeTarget()) || rows[0];
  const mean = values.reduce((sum, value) => sum + value, 0) / values.length;
  return {
    ...baseComparison,
    selected,
    selectedRecord: baseComparison.selectedRecord,
    selectedDisplayMonths: selected ? selected.comparisonMonths : baseComparison.selectedDisplayMonths,
    shortBasisLabel: "地點排名",
    rows,
    values,
    mean,
    category: selectedCategory,
    rankingMode: "location",
  };
}

function activeRankingComparison() {
  return usesLocationRanking() ? locationRankingComparison() : comparisonForYear(selectedYear);
}

function renderCoverageBadge(text) {
  if (!yearMonthsTop) return;
  yearMonthsTop.hidden = false;
  yearMonthsTop.classList.remove("ga-formula");
  yearMonthsTop.disabled = false;
  yearMonthsTop.removeAttribute("aria-disabled");
  yearMonthsTop.textContent = text;
}

function renderFormulaBadgeFor(category = selectedCategory) {
  if (!yearMonthsTop) return;
  const lines = activeFormulaLines(category);
  const html = activeFormulaHtml(category);
  if (!html && !lines.length) {
    yearMonthsTop.hidden = true;
    yearMonthsTop.classList.remove("ga-formula");
    yearMonthsTop.disabled = true;
    yearMonthsTop.setAttribute("aria-disabled", "true");
    yearMonthsTop.setAttribute("aria-expanded", "false");
    yearMonthsTop.innerHTML = "";
    if (monthPopover) monthPopover.hidden = true;
    return;
  }
  yearMonthsTop.hidden = false;
  yearMonthsTop.classList.add("ga-formula");
  yearMonthsTop.disabled = true;
  yearMonthsTop.setAttribute("aria-disabled", "true");
  yearMonthsTop.setAttribute("aria-expanded", "false");
  if (monthPopover) monthPopover.hidden = true;
  yearMonthsTop.innerHTML = [
    html || lines.map((line) => `<span class="ga-formula-line">${line}</span>`).join(""),
  ].join("");
}


function renderFormulaBadge() {
  renderFormulaBadgeFor(selectedCategory);
}


function replacementRecords(category = selectedCategory) {
  return [...(currentSeries(category).records || [])]
    .filter((row) => Number.isFinite(Number(row.value)))
    .sort((a, b) => Number(a.year) - Number(b.year));
}

function replacementIsRatio(category = selectedCategory) {
  return activeMeta(category).agg === "ratio";
}

function replacementCumulativeRows(category = selectedCategory) {
  const rows = replacementRecords(category);
  let cumulative = 0;
  return rows.map((row) => {
    const value = Number(row.value || 0);
    if (replacementIsRatio(category)) {
      return { ...row, cumulative: value };
    }
    cumulative += value;
    return { ...row, cumulative };
  });
}

function replacementSelectedRow(category = selectedCategory) {
  const rows = replacementRecords(category);
  return rows.find((row) => String(row.year) === String(selectedYear)) || rows[rows.length - 1] || null;
}

function replacementCumulativeValue(year, category = selectedCategory) {
  const row = replacementCumulativeRows(category).find((item) => String(item.year) === String(year));
  return row ? Number(row.cumulative || 0) : 0;
}

function replacementAnnualAverage(category = selectedCategory) {
  const rows = replacementRecords(category);
  if (!rows.length) return 0;
  return rows.reduce((sum, row) => sum + Number(row.value || 0), 0) / rows.length;
}

function replacementRelativePosition(value, values) {
  const available = values.map(Number).filter(Number.isFinite);
  if (!available.length) return 0;
  const minValue = Math.min(...available);
  const maxValue = Math.max(...available);
  if (Math.abs(maxValue - minValue) <= 1e-9) return 100;
  return ((Number(value) - minValue) / (maxValue - minValue)) * 100;
}

function setAxisLabels(left, middle, right) {
  const labels = document.querySelectorAll(".ga-axis span");
  if (labels[0]) labels[0].textContent = left;
  if (labels[1]) labels[1].textContent = middle;
  if (labels[2]) labels[2].textContent = right;
}

function setTextIfExists(id, value) {
  const node = document.getElementById(id);
  if (node) node.textContent = value;
}

function fitSingleLineText(node, maxSize = 12, minSize = 8.2) {
  if (!node) return;
  node.style.whiteSpace = "nowrap";
  node.style.fontSize = `${maxSize}px`;
  const available = node.clientWidth || node.parentElement?.clientWidth || 0;
  if (!available) return;
  let size = maxSize;
  while (size > minSize && node.scrollWidth > available) {
    size -= 0.2;
    node.style.fontSize = `${size.toFixed(1)}px`;
  }
}

function setSmallMetric(elementId, value, unit) {
  const node = document.getElementById(elementId);
  if (node) node.textContent = `${fmt.format(value)} ${unit}`;
}

function replacementMetricValue(category, year = selectedYear) {
  const row = replacementRecords(category).find((item) => String(item.year) === String(year));
  return row ? Number(row.value || 0) : 0;
}

function replacementMetricCumulative(category, year = selectedYear) {
  let total = 0;
  replacementRecords(category).forEach((row) => {
    if (Number(row.year) <= Number(year)) total += Number(row.value || 0);
  });
  return total;
}

function replacementYears() {
  const years = new Set();
  (GA_DATA.categories || []).forEach((category) => replacementRecords(category).forEach((row) => years.add(Number(row.year))));
  return [...years].filter(Number.isFinite).sort((a, b) => a - b);
}

function availableReplacementRangeYears() {
  const endYear = Number(selectedYear);
  return replacementYears().filter((year) => Number.isFinite(year) && year <= endYear);
}

function defaultReplacementYearRange() {
  const years = availableReplacementRangeYears();
  if (!years.length) return { start: Number(selectedYear), end: Number(selectedYear), isCustom: false };
  return { start: years[0], end: Number(selectedYear), isCustom: false };
}

function activeReplacementYearRange() {
  const years = availableReplacementRangeYears();
  if (!years.length) return defaultReplacementYearRange();
  if (!customReplacementYearRange) return defaultReplacementYearRange();
  const startCandidates = years.filter((year) => year <= customReplacementYearRange.end);
  const start = startCandidates.includes(Number(customReplacementYearRange.start)) ? Number(customReplacementYearRange.start) : startCandidates[0];
  const endCandidates = years.filter((year) => year >= start);
  const end = endCandidates.includes(Number(customReplacementYearRange.end)) ? Number(customReplacementYearRange.end) : endCandidates[endCandidates.length - 1];
  return { start, end, isCustom: true };
}

function formatYearRange(range) {
  if (!range || range.start === range.end) return `${range ? range.end : selectedYear} 年`;
  return `${range.start}-${range.end} 年`;
}

function sumReplacementMetric(category, start, end) {
  return replacementRecords(category).reduce((total, row) => {
    const year = Number(row.year);
    if (year >= Number(start) && year <= Number(end)) return total + Number(row.value || 0);
    return total;
  }, 0);
}

function replacementRangeMetrics() {
  const range = activeReplacementYearRange();
  const annualSaving = sumReplacementMetric("累積節省瓦數", range.start, range.end);
  const cumulativeQty = sumReplacementMetric("年度汰換數量", range.start, range.end);
  const dataYears = new Set(replacementRecords("累積節省瓦數")
    .map((row) => Number(row.year))
    .filter((year) => Number.isFinite(year) && year >= Number(range.start) && year <= Number(range.end)));
  const yearCount = Math.max(1, dataYears.size);
  return {
    range,
    rangeLabel: formatYearRange(range),
    annualSaving,
    averageSaving: annualSaving / yearCount,
    cumulativeSaving: annualSaving,
    cumulativeQty,
  };
}

function replacementStructureRows() {
  return replacementYears().map((year) => {
    const qty = replacementMetricValue("年度汰換數量", year);
    const nonLed = replacementMetricValue("非LED原舊燈具汰換量", year);
    return { year, qty, nonLed, ledOld: Math.max(qty - nonLed, 0), nonLedShare: qty > 0 ? nonLed / qty * 100 : 0 };
  }).filter((row) => row.qty > 0 || row.nonLed > 0);
}

function replacementMetrics(year = selectedYear) {
  const annualQty = replacementMetricValue("年度汰換數量", year);
  const nonLedQty = replacementMetricValue("非LED原舊燈具汰換量", year);
  return {
    annualSaving: replacementMetricValue("累積節省瓦數", year),
    cumulativeSaving: replacementMetricCumulative("累積節省瓦數", year),
    annualQty,
    cumulativeQty: replacementMetricCumulative("年度汰換數量", year),
    avgSaving: replacementMetricValue("平均節省瓦數", year),
    improveRate: replacementMetricValue("節能改善率", year),
    nonLedQty,
    ledOldQty: Math.max(annualQty - nonLedQty, 0),
    nonLedShare: annualQty > 0 ? nonLedQty / annualQty * 100 : 0,
  };
}

function replacementOutcomeProgress(metrics) {
  const years = replacementYears();
  const finalValue = years.length ? sumReplacementMetric("累積節省瓦數", Math.min(...years), Math.max(...years)) : 0;
  return {
    width: finalValue > 0 ? metrics.cumulativeSaving / finalValue * 100 : 0,
    color: "#d43f55",
    axis: ["起點", "所選範圍", "全期間"],
  };
}

function renderReplacementDom() {
  const metrics = replacementRangeMetrics();
  const progress = replacementOutcomeProgress(metrics);
  const width = Math.max(5, Math.min(100, progress.width));
  const rankFill = document.getElementById("rankFill");
  const rankPin = document.getElementById("rankPin");
  const rankNumberEl = document.getElementById("rankNumber");
  const meanDiffEl = document.getElementById("meanDiff");
  const singleYear = metrics.range.start === metrics.range.end;

  setTextIfExists("rankTitle", "累積節省瓦數");
  setTextIfExists("rankNumber", fmt.format(metrics.cumulativeSaving));
  setTextIfExists("rankTotal", `瓦｜${metrics.rangeLabel}`);
  if (rankNumberEl) rankNumberEl.style.color = progress.color;
  if (rankFill) {
    rankFill.style.width = `${width}%`;
    rankFill.style.background = "linear-gradient(90deg, #2563eb 0%, #b8c7d9 52%, #d43f55 100%)";
    rankFill.style.backgroundSize = `${10000 / width}% 100%`;
  }
  if (rankPin) rankPin.style.left = `${width}%`;
  setAxisLabels(...progress.axis);

  setTextIfExists("valueMiniLabel", singleYear ? "該年節省瓦數" : "年均節省瓦數");
  setSmallMetric("yearValue", singleYear ? metrics.annualSaving : metrics.averageSaving, "瓦");
  setTextIfExists("secondaryMiniLabel", "累積汰換數量");
  setSmallMetric("meanDiff", metrics.cumulativeQty, "顆/隻/片");
  if (meanDiffEl) meanDiffEl.style.color = progress.color;
  const hintPrefix = metrics.range.start === metrics.range.end
    ? `${metrics.range.end} 年均節省`
    : `${metrics.range.start}-${metrics.range.end} 年均節省`;
  setTextIfExists("rankHint", `${hintPrefix} ${fmt.format(metrics.averageSaving)} 瓦。總計已累積節省 ${fmt.format(metrics.cumulativeSaving)} 瓦`);
  fitSingleLineText(document.getElementById("rankHint"));
  renderCoverageBadge(`年度範圍 ${metrics.rangeLabel}`);
}

function emptyReplacementLayout(message) {
  return {

function renderReplacementOverview() {
  if (overviewModeSwitch) overviewModeSwitch.hidden = true;

function renderReplacementStructureOverview() {
  const rows = replacementStructureRows();
  if (overviewTitle) overviewTitle.textContent = "汰換量總覽";
  if (overviewNote) {
    overviewNote.textContent = "色段與 % 數＝非LED原燈具占比";
    overviewNote.hidden = false;
  }
  if (!rows.length) {
    Plotly.react("overviewChart", [], emptyReplacementLayout("目前沒有汰換量資料"), { displayModeBar: false, responsive: true });
    return;
  }

  const selectedRows = rows.filter((row) => String(row.year) === String(selectedYear));
  const otherRows = rows.filter((row) => String(row.year) !== String(selectedYear)).sort((a, b) => Number(b.year) - Number(a.year));
  const sorted = [...selectedRows, ...otherRows];
  const selectedInfo = selectedRows[0] || sorted[0];
  const labels = sorted.map((row) => `${row.year} 年`);
  const y = sorted.map((_, idx) => idx === 0 ? -0.1 : idx * 0.86);
  const totals = sorted.map((row) => Math.max(0, Number(row.qty || 0)));
  const maxQty = Math.max(...totals, 1);
  const shares = sorted.map((row) => Math.max(0, Math.min(100, Number(row.nonLedShare || 0))));
  const displayTotals = totals.map((total) => total > 0 ? Math.max(total, maxQty * 0.035) : 0);
  const displayNonLed = sorted.map((row, idx) => {
    const share = shares[idx];
    const total = displayTotals[idx];
    if (share <= 0 || total <= 0) return 0;
    const rawWidth = total * share / 100;
    const minStripe = maxQty * 0.014;
    return Math.min(total, Math.max(rawWidth, minStripe));
  });
  const selectedText = `${selectedInfo.year} 年非LED原燈具汰換量：${fmt.format(selectedInfo.nonLed)} 顆/隻/片`;
  const shareLabelMode = sorted.map((row, idx) => {
    if (displayNonLed[idx] >= maxQty * 0.28 && shares[idx] >= 12) return "segment";
    if (shares[idx] > 0) return "edge";
    return "outside";
  });
  // Fixed right-side column for quantity labels. It must be declared before
  // shareLabelX because short percentage labels use it as a collision boundary.
  const countColumnX = maxQty * 1.12;
  const countX = sorted.map(() => countColumnX);
  const xMax = maxQty * 1.48;
  const outsideShareX = sorted.map((row, idx) =>
    Math.max(displayTotals[idx] + maxQty * 0.018, maxQty * 0.052)
  );
  const shareLabelX = sorted.map((row, idx) => {
    if (shareLabelMode[idx] === "segment") return displayNonLed[idx] / 2;
    if (shareLabelMode[idx] === "edge") {
      return Math.min(displayNonLed[idx] + maxQty * 0.018, countColumnX - maxQty * 0.18);
    }
    return outsideShareX[idx];
  });
  const shareAnnotations = sorted.map((row, idx) => {
    const mode = shareLabelMode[idx];
    const outside = mode === "outside";
    const edge = mode === "edge";
    const segment = mode === "segment";
    const selected = String(row.year) === String(selectedYear);
    return {
      text: `${pctFmt.format(shares[idx])}%`,
      x: shareLabelX[idx],
      y: y[idx],
      xref: "x",
      yref: "y",
      showarrow: false,
      xanchor: segment ? "center" : "left",
      yanchor: "middle",
      bgcolor: outside || edge ? (selected ? "rgba(255,255,255,0.88)" : "rgba(255,255,255,0.78)") : "rgba(255,255,255,0)",
      bordercolor: outside || edge ? (selected ? "rgba(212,63,85,0.44)" : "rgba(203,213,225,0.62)") : "rgba(255,255,255,0)",
      borderwidth: outside || edge ? 1 : 0,
      borderpad: outside || edge ? 2 : 0,
      font: { size: 11, color: segment ? "#ffffff" : (selected ? "#b83248" : "#253047") },
    };
  });
  const countAnnotations = sorted.map((row, idx) => ({
    text: `${fmt.format(row.qty)} 顆/隻/片`,
    x: countX[idx],
    y: y[idx],
    xref: "x",
    yref: "y",
    showarrow: false,
    xanchor: "left",
    yanchor: "middle",
    font: { size: 12, color: "#253047" },
  }));

  Plotly.react("overviewChart", [
    {
      type: "bar",
      orientation: "h",
      name: "年度總汰換量",
      x: displayTotals,
      y,
      width: sorted.map(() => 0.58),
      marker: { color: "#e8eef6", line: { color: "#ffffff", width: 1 } },
      customdata: sorted.map((row) => [row.year, row.qty, row.nonLed, row.ledOld, row.nonLedShare]),
      hovertemplate: "%{customdata[0]} 年<br>年度汰換總量：%{customdata[1]:,.2f} 顆/隻/片<br>非LED原燈具：%{customdata[2]:,.2f}<br>LED原燈具：%{customdata[3]:,.2f}<br>非LED占比：%{customdata[4]:.1f}%<extra></extra>",
    },
    {
      type: "bar",
      orientation: "h",
      name: "非LED原燈具占比",
      x: displayNonLed,
      y,
      width: sorted.map(() => 0.58),
      marker: {
        color: sorted.map((row) => String(row.year) === String(selectedYear) ? "#d43f55" : "#8fa1bb"),
        line: { color: "#ffffff", width: 1 },
      },
      hoverinfo: "skip",
    },
  ], {
    barmode: "overlay",
    margin: { l: 66, r: 126, t: 42, b: 22 },
    paper_bgcolor: "rgba(0,0,0,0)",
    plot_bgcolor: "#ffffff",
    xaxis: { range: [0, xMax], visible: false, fixedrange: true },
    yaxis: { tickmode: "array", tickvals: y, ticktext: labels, range: [Math.max(...y) + 0.46, -0.74], showgrid: false, zeroline: false, fixedrange: true },
    showlegend: false,
    annotations: [
      {
        text: selectedText,
        x: 0,
        y: 0.99,
        xref: "paper",
        yref: "paper",
        showarrow: false,
        xanchor: "left",
        yanchor: "bottom",
        font: { size: 12, color: "#253047", weight: 900 },
      },
      ...shareAnnotations,
      ...countAnnotations,
    ],
  }, { displayModeBar: false, responsive: true });
}

function renderReplacementQualityDashboard() {
  if (qualityHead) qualityHead.hidden = false;

    qualityFormula.hidden = false;
    qualityFormula.innerHTML = `
      <span class="ga-formula-name">平均節省瓦數 =</span>

    Plotly.react("trendChart", [], emptyTrendLayout("目前沒有汰換品質資料"), { displayModeBar: false, responsive: true });

      rate: Number(rateMap.get(Number(row.year)) || 0),

      yanchor: "bottom",
      bgcolor: "rgba(255,255,255,0)",
      font: { size: 11, color: "#475569" },
    },
    ...rows.flatMap((row, idx) => ([
      {
        text: `${fmt.format(row.value)} 瓦`,
        x: valueX,
        y: y[idx],
        xref: "x",
        yref: "y",
        showarrow: false,
        xanchor: "left",
        yanchor: "middle",
        font: { size: 12, color: "#253047" },
      },
      {
        text: `改善率 ${fmt.format(row.rate)}%`,
        x: rateX,
        y: y[idx],
        xref: "x",
        yref: "y",
        showarrow: false,
        xanchor: "left",
        yanchor: "middle",
        bgcolor: String(row.year) === String(selectedYear) ? "rgba(212,63,85,0.12)" : "rgba(248,250,252,0.94)",
        bordercolor: String(row.year) === String(selectedYear) ? "#d43f55" : "#d9e1ec",
        borderwidth: 1,
        borderpad: 5,
        font: { size: 11, color: String(row.year) === String(selectedYear) ? "#b83248" : "#475569" },
      },
    ])),
  ];
  const layout = {
    margin: { l: 76, r: 26, t: 24, b: 48 },
    paper_bgcolor: "rgba(0,0,0,0)",
    plot_bgcolor: "#ffffff",
    xaxis: {
      range: [0, xMax],
      title: "平均節省瓦數（瓦）",
      gridcolor: "#edf2f7",
      zeroline: false,
      fixedrange: true,
    },
    yaxis: {
      tickmode: "array",
      tickvals: y,
      ticktext: rows.map((row) => `${row.year} 年`),
      range: [Math.max(...y) + 0.62, -0.82],
      showgrid: false,
      zeroline: false,
      fixedrange: true,
    },
    shapes: [
      {
        type: "line",
        x0: avgMean,
        x1: avgMean,

    annotations,
    showlegend: false,
  };
  Plotly.react("trendChart", [{
    type: "bar",
    orientation: "h",
    name: "平均節省瓦數",
    x: displayValues,
    y,
    width: rows.map(() => 0.54),
    marker: {
      color: rows.map((row) => String(row.year) === String(selectedYear) ? "#d43f55" : "#8fa1bb"),
      line: { color: "#ffffff", width: 1 },

function updateDom() {
  if (isReplacementChart()) {
    renderReplacementDom();
    return;
  }
  const comparison = activeRankingComparison();
  const row = comparison.selected;
  const rankingUnit = usesLocationRanking() ? locationAxisName() : "年";
  setTextIfExists("rankTitle", usesLocationRanking()
    ? `${locationAxisName()}排名-${activeValueNoun()}`
    : `歷史排名-${activeValueNoun()}`);
  if (!row) {
    setTextIfExists("rankNumber", "--");
    setTextIfExists("rankTotal", `/ 共 0 ${rankingUnit}`);
    setTextIfExists("valueMiniLabel", activeValueNoun());
    setTextIfExists("yearValue", "--");
    if (usesMonthCoverage()) renderCoverageBadge("資料涵蓋 無資料");
    else renderFormulaBadge();
    setTextIfExists("meanDiff", "--");
    const rankFillEmpty = document.getElementById("rankFill");
    if (rankFillEmpty) rankFillEmpty.style.width = "0%";
    const rankPinEmpty = document.getElementById("rankPin");
    if (rankPinEmpty) rankPinEmpty.style.left = "0%";
    setTextIfExists("rankHint", "目前篩選條件沒有可比較資料。");
    return;
  }
  const position = Math.round(row.relativePosition);
  const width = Math.max(5, Math.min(100, row.relativePosition));
  const diffPct = comparison.mean === 0 ? 0 : ((row.value - comparison.mean) / comparison.mean) * 100;
  const direction = diffPct >= 0 ? "高於" : "低於";
  const selectedColor = colorForPosition(row.relativePosition);

  setTextIfExists("rankNumber", row.rankHigh);
  const rankNumberEl = document.getElementById("rankNumber");
  if (rankNumberEl) rankNumberEl.style.color = selectedColor;
  setTextIfExists("rankTotal", `/ 共 ${comparison.rows.length} ${rankingUnit}`);
  setTextIfExists("valueMiniLabel", activeValueNoun());
  setMiniValue(row.value, activeUnit());
  if (usesMonthCoverage()) renderCoverageBadge(`資料涵蓋 ${formatMonths(comparison.selectedDisplayMonths)}`);
  else renderFormulaBadge();
  setTextIfExists("meanDiff", `${direction} ${pctFmt.format(Math.abs(diffPct))}%`);
  const meanDiffEl = document.getElementById("meanDiff");
  if (meanDiffEl) meanDiffEl.style.color = selectedColor;
  const rankFill = document.getElementById("rankFill");
  if (rankFill) rankFill.style.width = `${width}%`;
  if (rankFill) rankFill.style.backgroundSize = `${10000 / width}% 100%`;
  const rankPin = document.getElementById("rankPin");
  if (rankPin) rankPin.style.left = `${width}%`;
  setTextIfExists("rankHint",
    `${fmt.format(row.value)} ${activeUnit()}｜第 ${row.rankHigh} / 共 ${comparison.rows.length} ${rankingUnit}`);
}

function setMiniValue(value, unit) {
  const container = document.getElementById("yearValue");
  if (!container) return;
  container.innerHTML = "";
  const number = document.createElement("span");
  number.className = "ga-value-number";
  number.textContent = fmt.format(value);
  const unitEl = document.createElement("span");
  unitEl.className = "ga-value-unit";
  unitEl.textContent = unit;
  container.appendChild(number);
  container.appendChild(unitEl);
  requestAnimationFrame(() => fitMiniValueUnit(container, unitEl));
}

function fitMiniValueUnit(container, unitEl) {
  unitEl.style.fontSize = "";
  let size = parseFloat(getComputedStyle(unitEl).fontSize);
  while (container.scrollWidth > container.clientWidth && size > 9) {
    size -= 1;
    unitEl.style.fontSize = `${size}px`;
  }
}

const CATEGORY_COLORS = ["#d43f55", "#2563eb", "#0f766e", "#b45309", "#7c3aed", "#0891b2", "#475569"];
const CATEGORY_COLOR_MAP = {
  "ECOCO": "#d43f55",
  "寶特瓶": "#2563eb",
  "鋁罐": "#0f766e",
  "PP杯": "#b45309",
  "電池": "#7c3aed",
  "牛奶瓶": "#0891b2",
  "機台數": "#475569",
};

function categoryColor(category) {
  if (CATEGORY_COLOR_MAP[category]) return CATEGORY_COLOR_MAP[category];
  const list = hasCategoryControl() ? GA_DATA.categories : [GA_DATA.metric];
  const idx = Math.max(0, list.indexOf(category));
  return CATEGORY_COLORS[idx % CATEGORY_COLORS.length];
}

function categoryIcon(category) {
  return (GA_DATA.categoryIcons && GA_DATA.categoryIcons[category]) || category.slice(0, 1);
}

function renderTrendToggles() {
  if (!hasTrendToggles()) {
    trendToggles.hidden = true;
    return;
  }
  trendToggles.hidden = false;
  trendToggles.innerHTML = "";
  GA_DATA.categories.forEach((category) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = `ga-icon-toggle${visibleTrendCategories.has(category) ? " active" : ""}`;
    btn.style.color = categoryColor(category);
    btn.innerHTML = `<span>${category}</span>`;
    btn.addEventListener("click", () => {
      if (visibleTrendCategories.has(category)) {
        visibleTrendCategories.delete(category);
      } else {
        visibleTrendCategories.add(category);
      }
      if (visibleTrendCategories.size === 0) visibleTrendCategories.add(selectedCategory);
      renderTrendToggles();
      renderTrend();
    });
    trendToggles.appendChild(btn);
  });
}

function trendDialogScope() {
  const range = customMonthRange ? `${customMonthRange.start}-${customMonthRange.end}` : "default";
  const categories = hasTrendToggles() ? [...visibleTrendCategories].sort().join("|") : selectedCategory;
  return [selectedYear, selectedCategory, selectedLocation || "", range, categories].join("::");
}

function hideTrendHoverTip() {
  if (!trendHoverTip) return;
  trendHoverTip.style.display = "none";
}

function showTrendHoverTip(point) {
  if (!trendHoverTip || !point) return;
  const data = point.customdata || [];
  const category = data[4] || selectedCategory;
  const valueName = data[5] || activeValueNoun(category);
  const unit = data[6] || activeUnit(category);
  const categoryLine = hasTrendToggles() || hasCategoryControl()
    ? `<span>類別：${category}</span>`
    : "";
  trendHoverTip.innerHTML = `
    <strong>${fmt.format(point.y)} ${unit}</strong>
    ${categoryLine}
    <span>${point.x} 年｜${valueName}</span>
    <span>排名：${data[0]} / ${data[1]} 年</span>
    <span>比較基準：${data[3]}</span>
    <span>納入月份：${data[2]}</span>
  `;
  trendHoverTip.style.display = "block";

  const cardRect = trendHoverTip.offsetParent.getBoundingClientRect();
  const chartRect = trendChart.getBoundingClientRect();
  const fullLayout = trendChart._fullLayout || {};
  const margin = fullLayout.margin || { l: 0, t: 0 };
  let pointX = (chartRect.left - cardRect.left) + margin.l + (point.xaxis && point.xaxis.l2p ? point.xaxis.l2p(point.x) : 0);
  let pointY = (chartRect.top - cardRect.top) + margin.t + (point.yaxis && point.yaxis.l2p ? point.yaxis.l2p(point.y) : 0);
  if (!Number.isFinite(pointX) || !Number.isFinite(pointY)) {
    pointX = (point.event ? point.event.clientX : chartRect.left) - cardRect.left;
    pointY = (point.event ? point.event.clientY : chartRect.top) - cardRect.top;
  }
  const left = Math.min(pointX + 14, cardRect.width - trendHoverTip.offsetWidth - 8);
  const top = Math.max(8, Math.min(pointY - (trendHoverTip.offsetHeight / 2), cardRect.height - trendHoverTip.offsetHeight - 8));
  trendHoverTip.style.left = `${Math.max(8, left)}px`;
  trendHoverTip.style.top = `${top}px`;
}

function bindTrendClick(scope) {
  if (!trendChart || !trendChart.on) return;
  if (trendChart.removeAllListeners) {
    trendChart.removeAllListeners("plotly_click");
    trendChart.removeAllListeners("plotly_hover");
    trendChart.removeAllListeners("plotly_unhover");
  }
  trendChart.on("plotly_hover", (event) => showTrendHoverTip(event.points && event.points[0]));
  trendChart.on("plotly_unhover", hideTrendHoverTip);
  trendChart.on("plotly_click", (event) => {
    const point = event.points && event.points[0];
    if (!point) return;
    const data = point.customdata || [];
    const category = data[4] || selectedCategory;
    const year = String(point.x);
    const samePoint = trendDialogState
      && trendDialogState.scope === scope
      && trendDialogState.visible
      && String(trendDialogState.year) === year
      && trendDialogState.category === category;
    trendDialogState = samePoint
      ? { scope, year, category, visible: false }
      : { scope, year, category, visible: true };
    renderTrend();
  });
}

function clearTrendInteractions() {
  hideTrendHoverTip();
  if (trendChart && trendChart.removeAllListeners) {
    trendChart.removeAllListeners("plotly_click");
    trendChart.removeAllListeners("plotly_hover");
    trendChart.removeAllListeners("plotly_unhover");
  }
}

function orderedLocationRows(rows) {
  const target = locationModeTarget();
  const aggregate = aggregateLocationKey();
  if (!target || target === aggregate) return rows;
  return [
    ...rows.filter((row) => row.location === target),
    ...rows.filter((row) => row.location !== target),
  ];
}

function renderTrend() {
  if (qualityFormula) qualityFormula.hidden = true;
  if (isReplacementChart()) {
    renderReplacementTrend();
    return;
  }
  if (hasLocationOverviewMode() && overviewMode === "location") {
    renderLocationTrendBars();
    return;
  }
  const baseComparison = comparisonForYear(selectedYear, selectedCategory);
  const activeCategories = hasTrendToggles() ? [...visibleTrendCategories] : [selectedCategory];
  const comparisonByCategory = new Map();
  const traces = activeCategories.map((category) => {
    const comparison = comparisonForYear(selectedYear, category);
    comparisonByCategory.set(category, comparison);
    if (!comparison.rows.length) return null;
    const years = comparison.rows.map((item) => item.year);
    const values = comparison.rows.map((item) => item.value);
    const color = hasTrendToggles() ? categoryColor(category) : "#1f3b57";
    return {
      type: "scatter",
      mode: "lines+markers",
      name: category || GA_DATA.metric,
      x: years,
      y: values,
      line: { color, width: category === selectedCategory ? 3.4 : 2.4 },
      marker: {
        color: comparison.rows.map((item) => String(item.year) === String(selectedYear) ? color : "#ffffff"),
        size: comparison.rows.map((item) => String(item.year) === String(selectedYear) ? 13 : 8),
        line: { color, width: 2 },
      },
      customdata: comparison.rows.map((item) => [item.rankHigh, comparison.rows.length, formatMonths(item.comparisonMonths), comparison.shortBasisLabel, category, activeValueNoun(category), activeUnit(category)]),
      hoverinfo: "none",
    };
  }).filter(Boolean);
  const years = baseComparison.rows.map((item) => item.year);
  const selected = baseComparison.selected;
  if (!traces.length || !years.length || !selected) {
    Plotly.react("trendChart", [], {
      title: {
        text: `${boldTitle(`歷史趨勢-${activeValueNoun()}`)}<br><sup>${activeTrendSubtitle(selectedCategory, "目前篩選條件沒有資料")}</sup>`,
        x: 0,
        xanchor: "left",
        y: 0.974,
        yanchor: "top",
        pad: { t: 3, b: 0 },
        font: { size: 19, color: "#101827" },
      },
      margin: { l: 70, r: 92, t: 78, b: 62 },
      paper_bgcolor: "rgba(0,0,0,0)",
      plot_bgcolor: "#ffffff",
      xaxis: { visible: false },
      yaxis: { visible: false },
      annotations: [{
        text: "目前沒有可繪製的趨勢資料",
        x: 0.5,
        y: 0.5,
        xref: "paper",
        yref: "paper",
        showarrow: false,
        font: { size: 14, color: "#64748b" },
      }],
      showlegend: false,
    }, { displayModeBar: false, responsive: true });
    return;
  }

  const minYear = Math.min(...years);
  const maxYear = Math.max(...years);
  const scope = trendDialogScope();
  const defaultDialogCategory = activeCategories.includes(selectedCategory) ? selectedCategory : activeCategories[0];
  const currentDialogState = trendDialogState && trendDialogState.scope === scope
    ? trendDialogState
    : { scope, year: selectedYear, category: defaultDialogCategory, visible: true };
  const dialogComparison = comparisonByCategory.get(currentDialogState.category) || comparisonForYear(selectedYear, currentDialogState.category);
  const dialogRow = currentDialogState.visible
    ? dialogComparison.rows.find((item) => String(item.year) === String(currentDialogState.year))
    : null;
  const dialogYears = dialogComparison.rows.map((item) => item.year);
  const dialogIndex = dialogRow ? dialogYears.findIndex((year) => String(year) === String(dialogRow.year)) : -1;
  const dialogRows = dialogComparison.rows;
  const previousDialogRow = dialogIndex > 0 ? dialogRows[dialogIndex - 1] : null;
  const nextDialogRow = dialogIndex >= 0 && dialogIndex < dialogRows.length - 1 ? dialogRows[dialogIndex + 1] : null;
  let dialogSide = "center";
  let dialogVertical = "below";
  if (dialogRow && dialogRows.length > 1) {
    if (!previousDialogRow && nextDialogRow) {
      dialogSide = "right";
      dialogVertical = nextDialogRow.value < dialogRow.value ? "above" : "below";
    } else if (previousDialogRow && !nextDialogRow) {
      dialogSide = "left";
      dialogVertical = previousDialogRow.value < dialogRow.value ? "above" : "below";
    } else if (previousDialogRow && nextDialogRow) {
      const values = dialogRows.map((item) => item.value);
      const minValue = Math.min(...values);
      const maxValue = Math.max(...values);
      const yPosition = maxValue === minValue ? 0.5 : (dialogRow.value - minValue) / (maxValue - minValue);
      const candidates = [
        { side: "left", vertical: "above", neighbor: previousDialogRow },
        { side: "left", vertical: "below", neighbor: previousDialogRow },
        { side: "right", vertical: "above", neighbor: nextDialogRow },
        { side: "right", vertical: "below", neighbor: nextDialogRow },
      ].map((candidate) => {
        let score = 0;
        const neighborIsHigher = candidate.neighbor.value > dialogRow.value;
        const neighborIsLower = candidate.neighbor.value < dialogRow.value;
        if (candidate.vertical === "above") {
          score += 0.8;
          if (neighborIsHigher) score += 8;
          if (yPosition > 0.62) score += 6 + ((yPosition - 0.62) * 12);
        } else {
          if (neighborIsLower) score += 8;
          if (yPosition < 0.16) score += 3 + ((0.16 - yPosition) * 8);
        }
        if (candidate.side === "left" && dialogIndex <= 1) score += 1.6;
        if (candidate.side === "right" && dialogIndex >= dialogRows.length - 2) score += 1.6;
        return { ...candidate, score };
      }).sort((a, b) => a.score - b.score);
      dialogSide = candidates[0].side;
      dialogVertical = candidates[0].vertical;
    }
  }
  const dialogAx = dialogSide === "left" ? -40 : dialogSide === "right" ? 40 : 0;
  const dialogAy = dialogVertical === "above" ? -54 : 54;
  const dialogXAnchor = "center";
  const dialogYAnchor = dialogVertical === "above" ? "bottom" : "top";
  const dialogText = dialogRow
    ? `${fmt.format(dialogRow.value)} ${activeUnit(currentDialogState.category)}`
    : null;
  const annotations = [
    {
      x: maxYear,
      y: baseComparison.mean,
      xref: "x",
      yref: "y",
      text: `均值 ${fmt.format(baseComparison.mean)} ${activeUnit()}`,
      showarrow: false,
      xanchor: "left",
      yanchor: "middle",
      xshift: 8,
      yshift: 0,
      bgcolor: "rgba(0,0,0,0)",
      bordercolor: "rgba(0,0,0,0)",
      borderpad: 0,
      font: { size: 12, color: "#475569" },
    },
  ];
  if (dialogRow && dialogText) {
    annotations.push({
      x: dialogRow.year,
      y: dialogRow.value,
      xref: "x",
      yref: "y",
      text: dialogText,
      showarrow: true,
      arrowhead: 2,
      arrowcolor: "#cbd5e1",
      ax: dialogAx,
      ay: dialogAy,
      xanchor: dialogXAnchor,
      yanchor: dialogYAnchor,
      bgcolor: "rgba(255,255,255,0.94)",
      bordercolor: "#d9e1ec",
      borderpad: 6,
      font: { size: 12, color: "#101827" },
    });
  }

  Plotly.react("trendChart", traces, {
    title: {
      text: `${boldTitle(`歷史趨勢-${activeValueNoun()}`)}<br><sup>${activeTrendSubtitle(selectedCategory, `${baseComparison.shortBasisLabel}，每一點代表該比較基準下的累積量`)}</sup>`,
      x: 0,
      xanchor: "left",
      y: 0.974,
      yanchor: "top",
      pad: { t: 3, b: 0 },
      font: { size: 19, color: "#101827" },
    },
    shapes: [
      {
        type: "line",
        x0: selected.year,
        x1: selected.year,
        y0: 0,
        y1: 1,
        xref: "x",
        yref: "paper",
        line: { color: "#d43f55", width: 2, dash: "dot" },
      },
      {
        type: "line",
        x0: minYear,
        x1: maxYear,
        y0: baseComparison.mean,
        y1: baseComparison.mean,
        xref: "x",
        yref: "y",
        line: { color: "#64748b", width: 2, dash: "dash" },
      },
    ],
    annotations,
    margin: { l: 54, r: 80, t: 128, b: 78 },
    paper_bgcolor: "rgba(0,0,0,0)",
    plot_bgcolor: "#ffffff",
    xaxis: { tickmode: "array", tickvals: years, title: "", showgrid: false, zeroline: false },
    yaxis: { title: activeUnit(), rangemode: "tozero", gridcolor: "#e8eef6", zeroline: false },
    showlegend: false,
  }, { displayModeBar: false, responsive: true }).then(() => bindTrendClick(scope));
}

function renderLocationOverview(comparison) {
  const rows = locationRowsForSelectedYear().map((row) => ({
    label: row.location,
    value: row.value,
    months: row.comparisonMonths || [],
    hasData: row.hasData,
  }));
  const axisName = locationAxisName();
  const dataRows = rows.filter(hasLocationData);
  if (!rows.length || !dataRows.length) {
    if (overviewTitle) overviewTitle.textContent = `${axisName}總覽｜${selectedYear || "--"} 年`;
    Plotly.react("overviewChart", [], {
      margin: { l: 64, r: 86, t: 18, b: 42 },
      paper_bgcolor: "rgba(0,0,0,0)",
      plot_bgcolor: "#ffffff",
      annotations: [{
        text: `目前沒有可比較的${axisName}資料`,
        x: 0.5,
        y: 0.5,
        xref: "paper",
        yref: "paper",
        showarrow: false,
        font: { size: 13, color: "#64748b" },
      }],
      xaxis: { visible: false },
      yaxis: { visible: false },
      showlegend: false,
    }, { displayModeBar: false, responsive: true });
    return;
  }

  const maxValue = Math.max(...dataRows.map((row) => row.value), 1);
  const ranked = rows.map((row) => {
    if (!hasLocationData(row)) return { ...row, relativePosition: null };
    const lower = dataRows.filter((item) => item.value < row.value - 1e-9).length;
    const relativePosition = dataRows.length === 1 ? 100 : (lower / (dataRows.length - 1)) * 100;
    return { ...row, relativePosition };
  });
  const target = locationModeTarget();
  const aggregate = aggregateLocationKey();
  const sorted = target === aggregate
    ? [...ranked].sort((a, b) => b.value - a.value)
    : [
        ...ranked.filter((row) => row.label === target),
        ...ranked.filter((row) => row.label !== target).sort((a, b) => b.value - a.value),
      ];
  const yPositions = sorted.map((_, idx) => idx === 0 ? 0 : idx + 0.42);
  const actualValues = sorted.map((row) => hasLocationData(row) ? row.value : 0);
  const displayValues = visibleBarValues(actualValues);
  if (overviewTitle) overviewTitle.textContent = usesLocationRanking()
    ? `${axisName}排名`
    : `${axisName}總覽｜${selectedYear} 年${usesMonthCoverage() ? ` ${comparison.shortBasisLabel}` : ""}`;

  Plotly.react("overviewChart", [{
    type: "bar",
    orientation: "h",
    x: displayValues,
    y: yPositions,
    width: sorted.map(() => 0.58),
    text: sorted.map((row) => hasLocationData(row) ? `${fmt.format(row.value)} ${activeUnit()}` : ""),
    textposition: "outside",
    textfont: { color: "#253047", size: 12 },
    cliponaxis: false,
    marker: { color: sorted.map((row) => hasLocationData(row) ? colorForPosition(Math.round(row.relativePosition)) : "rgba(148,163,184,0)"), line: { color: "#ffffff", width: 1 } },
    customdata: sorted.map((row) => [row.label, formatMonths(row.months), hasLocationData(row) ? row.value : null]),
    hovertemplate: usesMonthCoverage()
      ? "%{customdata[0]}<br>" + activeValueNoun() + "：%{customdata[2]:,.2f} " + activeUnit() +
        "<br>資料涵蓋：%{customdata[1]}<extra></extra>"
      : "%{customdata[0]}<br>" + activeValueNoun() + "：%{customdata[2]:,.2f} " + activeUnit() + "<extra></extra>",
  }], {
    margin: { l: 86, r: 86, t: 18, b: 42 },
    paper_bgcolor: "rgba(0,0,0,0)",
    plot_bgcolor: "#ffffff",
    xaxis: {
      title: activeUnit(),
      gridcolor: "#edf2f7",
      zeroline: false,
      range: [0, Math.max(...displayValues, maxValue) * 1.18],
    },
    yaxis: {
      title: "",
      tickmode: "array",
      tickvals: yPositions,
      ticktext: sorted.map((row) => row.label),
      range: [Math.max(...yPositions) + 0.72, -0.56],
      automargin: true,
      showgrid: false,
      zeroline: false,
    },
    showlegend: false,
  }, { displayModeBar: false, responsive: true });
}

function renderOverview() {
  if (isReplacementChart()) {
    renderReplacementOverview();
    return;
  }
  const comparison = comparisonForYear(selectedYear, selectedCategory);
  const showEcocoPieMode = isEcocoChart() && selectedCategory === "ECOCO";
  const showLocationMode = hasLocationOverviewMode();
  overviewModeSwitch.hidden = !(showEcocoPieMode || showLocationMode);
  overviewModeSwitch.querySelectorAll("button").forEach((button) => {
    button.classList.toggle("active", button.dataset.overviewMode === overviewMode);
  });
  if (!(showEcocoPieMode || showLocationMode)) overviewMode = "bar";
  if (showLocationMode && overviewMode === "location") {
    renderLocationOverview(comparison);
    return;
  }
  if (showEcocoPieMode && overviewMode === "pie") {
    const totals = new Map();
    GA_DATA.categoryMonthly
      .filter((item) =>
        Number(item.year) === Number(selectedYear) &&
        Number(item.month) >= Number(comparison.startMonth) &&
        Number(item.month) <= Number(comparison.cutoffMonth)
      )
      .forEach((item) => totals.set(item.category, (totals.get(item.category) || 0) + Number(item.value || 0)));
    const rows = GA_DATA.rawCategories
      .map((category) => ({ category, value: totals.get(category) || 0 }))
      .filter((row) => row.value > 0)
      .sort((a, b) => b.value - a.value);
    const total = rows.reduce((sum, row) => sum + row.value, 0);
    if (overviewTitle) overviewTitle.textContent = "類別佔比";
    Plotly.react("overviewChart", [{
      type: "pie",
      labels: rows.map((row) => row.category),
      values: rows.map((row) => row.value),
      hole: 0.42,
      sort: false,
      automargin: true,
      domain: { x: [0.05, 0.95], y: [0.03, 0.84] },
      marker: { colors: rows.map((row) => categoryColor(row.category)), line: { color: "#ffffff", width: 2 } },

      textposition: "outside",
      textfont: { size: 11 },
      hovertemplate: "%{label}<br>" + activeValueNoun() + "：%{value:,.2f} " + activeUnit() + "<br>佔比：%{percent}<extra></extra>",

      annotations: [{
        text: `${fmt.format(total)}<br>${activeUnit()}`,
        x: 0.5,
        y: 0.435,
        showarrow: false,
        font: { size: 14, color: "#101827" },
      }],
      margin: { l: 28, r: 28, t: 38, b: 18 },
      paper_bgcolor: "rgba(0,0,0,0)",
      plot_bgcolor: "#ffffff",

      paper_bgcolor: "rgba(0,0,0,0)",
      plot_bgcolor: "#ffffff",
      annotations: [{
        text: "目前沒有可比較的年度資料",
        x: 0.5,
        y: 0.5,
        xref: "paper",
        yref: "paper",
        showarrow: false,
        font: { size: 13, color: "#64748b" },
      }],
      xaxis: { visible: false },
      yaxis: { visible: false },
      showlegend: false,
    }, { displayModeBar: false, responsive: true });

  }
  const selectedBars = comparison.rows.filter((item) => String(item.year) === String(selectedYear));
  const otherBars = comparison.rows
    .filter((item) => String(item.year) !== String(selectedYear))
    .sort((a, b) => b.year - a.year);

    text: bars.map((item) => `${fmt.format(item.value)} ${activeUnit()}`),
    textposition: "outside",
    textfont: { color: "#253047", size: 12 },
    cliponaxis: false,
    marker: { color: colors, line: { color: "#ffffff", width: 1 } },
    customdata: bars.map((item) => [
      item.rankHigh,
      comparison.rows.length,
      formatMonths(item.comparisonMonths),
      comparison.shortBasisLabel,
      `${item.year} 年`,
