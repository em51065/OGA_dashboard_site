    hovertemplate: usesMonthCoverage()
      ? "%{customdata[4]}<br>" + activeValueNoun() + "：%{customdata[5]:,.2f} " + activeUnit() +
        "<br>第 %{customdata[0]} / 共 %{customdata[1]} 年" +
        "<br>資料涵蓋：%{customdata[2]}" +
        "<br>比較基準：%{customdata[3]}<extra></extra>"
      : "%{customdata[4]}<br>" + activeValueNoun() + "：%{customdata[5]:,.2f} " + activeUnit() +
        "<br>第 %{customdata[0]} / 共 %{customdata[1]} 年<extra></extra>",
  }], {
    margin: { l: 64, r: 86, t: 18, b: 42 },
    paper_bgcolor: "rgba(0,0,0,0)",
    plot_bgcolor: "#ffffff",
    xaxis: {
      title: activeUnit(),
      gridcolor: "#edf2f7",
      zeroline: false,
      range: [0, Math.max(...displayValues, maxValue) * 1.18],
    },
    yaxis: {
      title: "",
      tickmode: "array",
      tickvals: yPositions,
      ticktext: labels,
      range: [Math.max(...yPositions) + 0.72, -0.56],
      automargin: true,
      showgrid: false,
      zeroline: false,
    },
    showlegend: false,
  }, { displayModeBar: false, responsive: true });
}

function availableMonthsForSelection() {
  const record = recordForYear(selectedYear, selectedCategory);
  return [...new Set((record ? record.monthsList : []) || [])]
    .map(Number)
    .filter(Number.isFinite)
    .sort((a, b) => a - b);
}

function fillMonthSelect(select, values, selectedValue, suffix = "月") {
  select.innerHTML = "";
  values.forEach((value) => {
    const opt = document.createElement("option");
    opt.value = String(value);
    opt.textContent = `${value}${suffix}`;
    select.appendChild(opt);
  });
  select.value = String(selectedValue);
}

function syncMonthRangeControls() {
  const title = monthPopover ? monthPopover.querySelector(".ga-month-title") : null;
  const labels = monthPopover ? monthPopover.querySelectorAll(".ga-month-fields label") : [];
  if (usesYearRange()) {
    const years = availableReplacementRangeYears();
    if (!years.length) return;
    if (title) title.textContent = "選擇年度範圍";
    if (labels[0] && labels[0].childNodes[0]) labels[0].childNodes[0].nodeValue = "起年 ";
    if (labels[1] && labels[1].childNodes[0]) labels[1].childNodes[0].nodeValue = "迄年 ";
    const fallback = activeReplacementYearRange();
    const start = years.includes(Number(fallback.start)) ? Number(fallback.start) : years[0];
    const endCandidates = years.filter((year) => year >= start);
    const end = endCandidates.includes(Number(fallback.end)) ? Number(fallback.end) : endCandidates[endCandidates.length - 1];
    fillMonthSelect(monthStartSelect, years, start, "年");
    fillMonthSelect(monthEndSelect, endCandidates, end, "年");
    return;
  }
  if (!usesMonthCoverage()) return;
  if (title) title.textContent = "選擇資料涵蓋範圍";
  if (labels[0] && labels[0].childNodes[0]) labels[0].childNodes[0].nodeValue = "起月 ";
  if (labels[1] && labels[1].childNodes[0]) labels[1].childNodes[0].nodeValue = "迄月 ";
  const months = availableMonthsForSelection();
  if (!months.length) return;
  const fallbackStart = customMonthRange ? customMonthRange.start : months[0];
  const fallbackEnd = customMonthRange ? customMonthRange.end : months[months.length - 1];
  const start = months.includes(Number(fallbackStart)) ? Number(fallbackStart) : months[0];
  const endCandidates = months.filter((month) => month >= start);
  const end = endCandidates.includes(Number(fallbackEnd)) ? Number(fallbackEnd) : endCandidates[endCandidates.length - 1];
  fillMonthSelect(monthStartSelect, months, start);
  fillMonthSelect(monthEndSelect, endCandidates, end);
}

function closeMonthPopover() {
  if (monthPopover) monthPopover.hidden = true;
  yearMonthsTop.setAttribute("aria-expanded", "false");
}

function openMonthPopover() {
  if (!usesMonthCoverage() && !usesYearRange()) return;
  syncMonthRangeControls();
  if (monthPopover) monthPopover.hidden = false;
  yearMonthsTop.setAttribute("aria-expanded", "true");
}

function resetMonthRange() {
  customMonthRange = null;
  customReplacementYearRange = null;
  closeMonthPopover();
}

function updateAll() {
  updateDom();
  if (monthPopover && !monthPopover.hidden) syncMonthRangeControls();
  renderTrendToggles();
  renderTrend();
  renderOverview();
}

function populateYearSelect() {
  const series = currentSeries();
  yearSelect.innerHTML = "";
  if (!series.records || !series.records.length) {
    const opt = document.createElement("option");
    opt.value = "";
    opt.textContent = "無可用年份";
    yearSelect.appendChild(opt);
    selectedYear = "";
    yearSelect.value = "";
    return;
  }
  [...series.records].sort((a, b) => b.year - a.year).forEach((row) => {
    const opt = document.createElement("option");
    opt.value = String(row.year);
    opt.textContent = `${row.year} 年`;
    yearSelect.appendChild(opt);
  });
  selectedYear = String(series.defaultYear || GA_DATA.defaultYear);
  yearSelect.value = selectedYear;
}

function initSelect() {
  if (GA_DATA.locations && GA_DATA.locations.length) {
    locationControl.hidden = false;
    if (locationLabel) locationLabel.textContent = GA_DATA.locationLabel || "選擇地點";
    locationSelect.innerHTML = "";
    GA_DATA.locations.forEach((location) => {
      const opt = document.createElement("option");
      opt.value = location;
      opt.textContent = location;
      locationSelect.appendChild(opt);
    });
    selectedLocation = GA_DATA.defaultLocation || GA_DATA.locations[0];
    locationSelect.value = selectedLocation;
    locationSelect.disabled = GA_DATA.locations.length <= 1;
    locationSelect.addEventListener("change", (event) => {
      selectedLocation = event.target.value;
      resetMonthRange();
      populateYearSelect();
      updateAll();
    });
  } else {
    locationControl.hidden = true;
  }

  if (hasCategoryControl()) {
    categoryControl.hidden = false;
    if (categoryLabel) categoryLabel.textContent = GA_DATA.categoryLabel || "選擇類別";
    categorySelect.innerHTML = "";
    GA_DATA.categories.forEach((category) => {
      const opt = document.createElement("option");
      opt.value = category;
      opt.textContent = category;
      categorySelect.appendChild(opt);
    });
    selectedCategory = GA_DATA.defaultCategory;
    categorySelect.value = selectedCategory;
    visibleTrendCategories = new Set([selectedCategory]);
    if (isReplacementChart()) categoryControl.hidden = true;
    categorySelect.addEventListener("change", (event) => {
      selectedCategory = event.target.value;
      visibleTrendCategories = new Set([selectedCategory]);
      overviewMode = "bar";
      resetMonthRange();
      populateYearSelect();
      updateAll();
    });
    overviewModeSwitch.querySelectorAll("button").forEach((button) => {
      button.addEventListener("click", () => {
        overviewMode = button.dataset.overviewMode;
        updateAll();
      });
    });
  } else {
    categoryControl.hidden = true;
    selectedCategory = GA_DATA.metric;
    visibleTrendCategories = new Set([selectedCategory]);
  }
  const modeButtons = overviewModeSwitch ? overviewModeSwitch.querySelectorAll("button") : [];
  if (hasLocationOverviewMode()) {
    if (modeButtons[0]) { modeButtons[0].textContent = "年度"; modeButtons[0].dataset.overviewMode = "bar"; }
    if (modeButtons[1]) { modeButtons[1].textContent = "地點"; modeButtons[1].dataset.overviewMode = "location"; }
  } else {
    if (modeButtons[0]) { modeButtons[0].textContent = "長條"; modeButtons[0].dataset.overviewMode = "bar"; }
    if (modeButtons[1]) { modeButtons[1].textContent = "圓餅"; modeButtons[1].dataset.overviewMode = "pie"; }
  }
  populateYearSelect();
  yearSelect.addEventListener("change", (event) => {
    selectedYear = event.target.value;
    resetMonthRange();
    updateAll();
  });
  yearMonthsTop.addEventListener("click", (event) => {
    event.stopPropagation();
    if (!usesMonthCoverage() && !usesYearRange()) return;
    if (monthPopover && monthPopover.hidden) openMonthPopover();
    else closeMonthPopover();
  });
  monthPopover.addEventListener("click", (event) => {
    event.stopPropagation();
  });
  monthStartSelect.addEventListener("change", () => {
    const start = Number(monthStartSelect.value);
    const values = (usesYearRange() ? availableReplacementRangeYears() : availableMonthsForSelection()).filter((value) => value >= start);
    const currentEnd = Number(monthEndSelect.value);
    const end = values.includes(currentEnd) ? currentEnd : values[values.length - 1];
    fillMonthSelect(monthEndSelect, values, end, usesYearRange() ? "年" : "月");
  });
  monthApplyBtn.addEventListener("click", () => {
    const start = Number(monthStartSelect.value);
    const end = Number(monthEndSelect.value);
    if (usesYearRange()) customReplacementYearRange = { start: Math.min(start, end), end: Math.max(start, end) };
    else customMonthRange = { start: Math.min(start, end), end: Math.max(start, end) };
    closeMonthPopover();
    updateAll();
  });
  monthResetBtn.addEventListener("click", () => {
    resetMonthRange();
    updateAll();
  });
  document.addEventListener("click", closeMonthPopover);
}

function showError(error) {
  document.getElementById("gaWidget").innerHTML = `<div class="ga-error">資料載入失敗：${error.message}</div>`;
}

fetch(`./data.json?t=${Date.now()}`)
  .then((response) => {
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    return response.json();
  })
  .then((data) => {
    GA_DATA = data;
    document.body.classList.toggle("ga-replacement-chart", isReplacementChart());
    initSelect();
    updateAll();
  })
  .catch(showError);

window.addEventListener("resize", () => {
  if (isReplacementChart()) fitSingleLineText(document.getElementById("rankHint"));
  Plotly.Plots.resize(document.getElementById("trendChart"));
  Plotly.Plots.resize(document.getElementById("overviewChart"));
});
</script>
</body>
</html>
