<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>國立成功大學永續數據儀表板</title>
  <script src="../assets/nav-config.js"></script>
  <script>
    (function () {
      "use strict";
      var width = Number(window.OGA_NAV && window.OGA_NAV.COMPACT_MAX_WIDTH);
      if (!Number.isFinite(width) || width <= 0) width = 760;
      // FOUC guard — index.html hint only; explorer.js re-syncs via adaptive measure after nav render.
      document.documentElement.classList.toggle(
        "is-layout-compact",
        window.matchMedia("(max-width: " + width + "px)").matches
      );
    })();
  </script>
  <link rel="stylesheet" href="../assets/explorer.css">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
</head>
<body>
  <main class="oga-portal" id="ogaPortal">
    <header class="oga-header">
      <div class="oga-brand">
        <span class="oga-brand-mark" aria-hidden="true"><i data-lucide="chart-no-axes-combined"></i></span>
        <div>
          <span class="oga-eyebrow">國立成功大學</span>
          <h1>永續數據儀表板</h1>
          <p>公開檢視校園永續相關指標的歷史位置、趨勢與校園設施盤點。</p>
        </div>
      </div>
    </header>

    <nav class="oga-chart-nav" id="desktopChartNav" aria-label="選擇圖表"></nav>
    <button type="button" class="oga-nav-dismiss" id="navDismiss" hidden aria-label="關閉選單"></button>

    <nav class="oga-mobile-theme-nav" id="mobileThemeNav" aria-label="手機圖表主題"></nav>

    <label class="oga-mobile-select">
      <span>選擇圖表</span>
      <select id="mobileChartSelect"></select>
    </label>

    <section class="oga-stage" id="chartStage" aria-busy="true">
      <div class="oga-stage-bar" id="chartStageBar">
        <div class="oga-stage-current">
          <span class="oga-stage-label">目前檢視</span>
          <strong id="activeChartTitle">ECOCO</strong>
        </div>
        <p class="oga-open-nudge" id="openNudge" hidden>
          <span id="openNudgeLabel">另開視窗最佳瀏覽請點擊 →</span>
        </p>
        <a id="standaloneLink" href="../charts/ecoco/" target="_blank" rel="noopener">
          <span class="oga-open-label oga-open-label--desktop">在新視窗開啟</span>
          <span class="oga-open-label oga-open-label--mobile">開啟手機友善版</span>
          <i data-lucide="external-link" aria-hidden="true"></i>
        </a>
      </div>

      <div class="oga-frame-wrap">
        <div class="oga-loading" id="loadingState" role="status">
          <span class="oga-loading-mark"><i data-lucide="loader-circle" aria-hidden="true"></i></span>
          <strong>正在載入完整互動圖表</strong>
        </div>
        <iframe
          id="chartFrame"
          title="ECOCO互動圖表"
          src="about:blank"
          scrolling="no"
          loading="eager"
        ></iframe>
      </div>
    </section>

    <footer class="oga-footnote" aria-label="資料說明">
      <p id="sourceInfo">資料來源：總務處</p>
      <p class="oga-footnote-note">本儀表板由永續處製作；原始資料由總務處提供。圖表數值為彙總統計，不含個人識別資訊。</p>
    </footer>
  </main>
  <script src="../assets/explorer.js"></script>
</body>
</html>
